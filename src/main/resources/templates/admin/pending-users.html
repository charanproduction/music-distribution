<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pending User Approvals</title>
</head>
<body>
<div th:replace="~{layout :: layout(~{::content}, 'pendingUsers')}">
    <div th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Pending User Approvals</h3>
        </div>

        <div th:if="${param.approved}" class="alert alert-success">
            User approved successfully.
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Channel</th>
                            <th>Contact</th>
                            <th style="width: 120px;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${pendingUsers}">
                            <td th:text="${u.username}"></td>
                            <td th:text="${u.email}"></td>
                            <td th:text="${u.channelName}"></td>
                            <td th:text="${u.contactNo}"></td>
                            <td>
                                <form th:action="@{|/admin/users/${u.id}/approve|}" method="post" class="d-inline">
                                    <button class="btn btn-success btn-sm">
                                        <i class="fas fa-check"></i> Approve
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pendingUsers)}">
                            <td colspan="5" class="text-center text-muted p-3">
                                No pending users.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

</body>
</html>
