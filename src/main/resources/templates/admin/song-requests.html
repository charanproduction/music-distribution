<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:fragment="pageTitle">Song Requests Review</title>
</head>
<body>

<div th:replace="~{layout :: layout(~{::content}, 'adminSongRequests')}">

    <div th:fragment="content">

        <h2 class="mb-4">
            <i class="fas fa-tasks"></i> Song Request Review
        </h2>

        <!-- FILTER BAR -->
        <div class="card mb-3">
            <div class="card-body">
                <form method="get" class="form-inline">
                    <label class="mr-2">Status:</label>
                    <select name="status" class="form-control mr-2">
                        <option th:value="" th:selected="${selectedStatus == null}">All Active</option>
                        <option th:each="st : ${allStatuses}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${st == selectedStatus}"></option>
                    </select>

                    <button class="btn btn-primary btn-sm">
                        <i class="fas fa-filter"></i> Apply
                    </button>
                </form>
            </div>
        </div>

        <!-- REQUESTS TABLE -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Requests Queue</h3>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="thead-light">
                    <tr>
                        <th>ID</th>
                        <th>Channel</th>
                        <th>Song</th>
                        <th>Uploaded</th>
                        <th>Release Date</th>
                        <th>Status</th>
                        <th>Latest Comment</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${requestPage == null or requestPage.content.isEmpty()}">
                        <td colspan="8" class="text-center text-muted p-3">No requests found.</td>
                    </tr>
                    <tr th:each="r : ${requestPage.content}">
                        <td th:text="${r.id}"></td>
                        <td th:text="${r.channelName}"></td>
                        <td th:text="${r.songName}"></td>
                        <td th:text="${#temporals.format(r.uploadedAt, 'dd-MMM-yyyy HH:mm')}"></td>
                        <td th:text="${r.releaseDate}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${r.status.name() == 'PENDING_REVIEW'} ? ' badge-warning' :
                                                  ${r.status.name() == 'ACTION_REQUIRED'} ? ' badge-danger' :
                                                  ${r.status.name() == 'MARKED_FOR_REVIEW'} ? ' badge-info' :
                                                  ${r.status.name() == 'APPROVED'} ? ' badge-success' :
                                                  ${r.status.name() == 'COMPLETED'} ? ' badge-success' :
                                                  ${r.status.name() == 'CANCELLED'} ? ' badge-secondary' :
                                                  ' badge-dark'"
                                  th:text="${r.status}"></span>
                        </td>
                        <td th:text="${r.latestComment}">-</td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-primary js-open-view"
                                        data-toggle="modal"
                                        data-target="#adminViewModal"
                                        th:attr="data-id=${r.id}">
                                    <i class="fas fa-eye"></i>
                                </button>

                                <!-- QUICK STATUS ACTIONS -->
                                <form th:action="@{|/admin/song-requests/${r.id}/status|}"
                                      method="post" class="d-inline">
                                    <input type="hidden" name="newStatus" value="ACTION_REQUIRED">
                                    <button class="btn btn-outline-warning"
                                            title="Mark Action Required">
                                        <i class="fas fa-exclamation-circle"></i>
                                    </button>
                                </form>

                                <form th:action="@{|/admin/song-requests/${r.id}/status|}"
                                      method="post" class="d-inline">
                                    <input type="hidden" name="newStatus" value="APPROVED">
                                    <button class="btn btn-outline-success"
                                            title="Approve">
                                        <i class="fas fa-check"></i>
                                    </button>
                                </form>

                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <!-- Pagination -->
                <nav th:if="${requestPage != null and requestPage.totalPages > 1}">
                    <ul class="pagination justify-content-center mt-3">
                        <li class="page-item" th:classappend="${requestPage.number == 0} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{|/admin/song-requests?page=${requestPage.number - 1}|}">
                                Previous
                            </a>
                        </li>
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, requestPage.totalPages-1)}"
                            th:classappend="${i == requestPage.number} ? 'active'">
                            <a class="page-link"
                               th:text="${i+1}"
                               th:href="@{|/admin/song-requests?page=${i}|}">1</a>
                        </li>
                        <li class="page-item"
                            th:classappend="${requestPage.number == requestPage.totalPages-1} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{|/admin/song-requests?page=${requestPage.number + 1}|}">
                                Next
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <!-- VIEW / REVIEW MODAL (content loaded from fragment) -->
        <div class="modal fade" id="adminViewModal" tabindex="-1" role="dialog">
            <div class="modal-dialog modal-lg" role="document">
                <div class="modal-content" id="adminViewModalContent">
                    <div class="modal-body text-center p-5">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            document.addEventListener("DOMContentLoaded", function () {
                $('.js-open-view').on('click', function () {
                    const id = $(this).data('id');
                    $('#adminViewModalContent').html('<div class="modal-body text-center p-5"><i class="fas fa-spinner fa-spin fa-2x"></i></div>');
                    $('#adminViewModalContent').load(/*[[@{/admin/song-requests/}]]*/'/admin/song-requests/' + id);
                });
            });
        </script>

    </div>

</div>
</body>
</html>
