<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{layout :: layout(~{::content}, 'reportsHistory')}">

    <div th:fragment="content">

        <h3 class="mb-3">
            <i class="fas fa-file-csv"></i>
            Report History
        </h3>

        <!-- FILTER: filename only (labels now handled in modal) -->
        <form method="get" class="form-row mb-3">
            <div class="col-md-4">
                <input class="form-control form-control-sm"
                       name="search"
                       th:value="${search}"
                       placeholder="Search filename...">
            </div>

            <div class="col-md-2">
                <button class="btn btn-primary btn-sm btn-block">
                    <i class="fas fa-search"></i> Filter
                </button>
            </div>
        </form>

        <!-- TABLE -->
        <div class="card">
            <div class="card-header">
                Uploaded Reports
            </div>
            <div class="card-body p-0">

                <table class="table table-striped table-hover mb-0" id="reportHistoryTable">
                    <thead class="thead-light">
                    <tr>
                        <th style="width:60px;">
                            <input type="checkbox" onclick="toggleAll(this)">
                        </th>
                        <th>
                            <a th:href="@{|/admin/reports/history/service?search=${search}|}">
                                File Name <i class="fas fa-sort"></i>
                            </a>
                        </th>
                        <th>Type</th>
                        <th>Year</th>
                        <th>Quarter</th>
                        <th>Uploaded</th>
                        <th style="width:140px;">Published</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="r : ${reports}">
                        <td>
                            <input type="checkbox" name="reportIds" th:value="${r.id}">
                        </td>
                        <td th:text="${r.fileName}"></td>
                        <td th:text="${r.reportType}"></td>
                        <td th:text="${r.year}"></td>
                        <td th:text="${r.quarter}"></td>
                        <td th:text="${#temporals.format(r.uploadedDate, 'yyyy-MM-dd')}"></td>

                        <td class="text-center">
                            <span class="badge badge-success"
                                  th:if="${r.publishedForAllChannels}">Published</span>

                            <button th:if="${!r.publishedForAllChannels}"
                                    type="button"
                                    class="btn btn-success btn-sm publish-btn"
                                    th:data-id="${r.id}"
                                    th:data-file="${r.fileName}"
                                    th:data-type="${r.reportType}"
                                    th:data-year="${r.year}"
                                    th:data-quarter="${r.quarter}">
                                Publish
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <!-- PAGING (window of 5 pages) -->
                <nav class="m-2" th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center">

                        <li class="page-item" th:classappend="${reports.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{|/admin/reports/history/service?page=${reports.number - 1}&search=${search}|}">
                                Previous
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(
                                    T(java.lang.Math).max(0, reports.number - 2),
                                    T(java.lang.Math).min(reports.totalPages - 1, reports.number + 2)
                            )}"
                            th:classappend="${i == reports.number} ? 'active'">
                            <a class="page-link"
                               th:text="${i + 1}"
                               th:href="@{|/admin/reports/history/service?page=${i}&search=${search}|}">
                            </a>
                        </li>

                        <li class="page-item" th:classappend="${reports.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{|/admin/reports/history/service?page=${reports.number + 1}&search=${search}|}">
                                Next
                            </a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>

        <!-- BULK ACTIONS -->
        <button class="btn btn-success btn-sm mt-3" onclick="downloadSelected()">
            <i class="fas fa-file-download"></i> Download
        </button>

        <button class="btn btn-danger btn-sm mt-3" onclick="deleteSelected()">
            <i class="fas fa-trash"></i> Delete
        </button>

        <!-- PUBLISH MODAL -->
        <div class="modal fade" id="publishModal" tabindex="-1" role="dialog" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <form id="publishForm">
                        <div class="modal-header">
                            <h5 class="modal-title">Publish Report for Channels</h5>
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>

                        <div class="modal-body">

                            <input type="hidden" id="publishUploadId" name="uploadId"/>

                            <div class="form-group">
                                <label>File</label>
                                <input class="form-control" id="publishFile" readonly>
                            </div>

                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label>Type</label>
                                    <input class="form-control" id="publishType" readonly>
                                </div>
                                <div class="form-group col-md-4">
                                    <label>Year</label>
                                    <input class="form-control" id="publishYear" readonly>
                                </div>
                                <div class="form-group col-md-4">
                                    <label>Quarter</label>
                                    <input class="form-control" id="publishQuarter" readonly>
                                </div>
                            </div>

                            <hr/>

                            <div class="form-group">
                                <label>Channels / Labels in this file</label>
                                <div id="publishChannelContainer"
                                     class="border rounded p-2"
                                     style="max-height: 220px; overflow-y: auto;">
                                    <div class="text-muted small">Loading labels…</div>
                                </div>
                            </div>

                            <div class="form-check mb-2">
                                <input type="checkbox" class="form-check-input" id="publishSelectAll">
                                <label class="form-check-label" for="publishSelectAll">
                                    Select all labels for this report
                                </label>
                            </div>

                            <small class="text-muted d-block">
                                Only the selected labels’ users will see this report in their dashboard.
                            </small>

                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">
                                Close
                            </button>
                            <button type="submit" class="btn btn-primary">
                                Confirm Publish
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- DO NOT re-include app.js here if layout already does it -->

    </div>
</div>
</html>
