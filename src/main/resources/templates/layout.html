<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:fragment="layout(content, activePage)">

<head>
<meta charset="UTF-8" />
<title>Music Distribution</title>

<!-- AdminLTE CSS -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" />

<!-- Font Awesome -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<!-- Bootstrap -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />

<style>
.nav-sidebar .nav-link.active {
	background-color: #0d6efd !important;
	color: #fff !important;
}
</style>
</head>

<body class="hold-transition sidebar-mini layout-fixed" id="mainBody">
	<div class="wrapper">

		<!-- NAVBAR -->
		<nav class="main-header navbar navbar-expand navbar-dark bg-dark">
			<!-- Left -->
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link" data-widget="pushmenu"
					href="#"><i class="fas fa-bars"></i></a></li>
				<li class="nav-item d-none d-sm-inline-block text-white pt-2">
					<b>🎧 Music Distribution</b>
				</li>
			</ul>
			<!-- Right -->
			<ul class="navbar-nav ml-auto">
				<li class="nav-item text-white pt-2"><span
					sec:authentication="name"></span></li>
				<li class="nav-item ml-2">
					<form th:action="@{/logout}" method="post">
						<button class="btn btn-outline-light btn-sm">Logout</button>
					</form>
				</li>
			</ul>
		</nav>

		<!-- SIDEBAR -->
		<aside class="main-sidebar sidebar-dark-primary elevation-4">
			<a href="#" class="brand-link text-center"> <span
				class="brand-text font-weight-light">Music Admin</span>
			</a>
			<div class="sidebar">
				<nav class="mt-2">
					<ul class="nav nav-pills nav-sidebar flex-column">

						<!-- Admin Menu -->
						<li class="nav-item"><a th:href="@{/admin/dashboard}"
							class="nav-link"
							th:classappend="${activePage}=='dashboard' ? ' active'"> <i
								class="nav-icon fas fa-gauge"></i>
								<p>Dashboard</p>
						</a></li>

						<li class="nav-item"><a th:href="@{/admin/songs/upload}"
							class="nav-link"
							th:classappend="${activePage}=='songs' ? ' active'"> <i
								class="nav-icon fas fa-upload"></i>
								<p>Upload Songs</p>
						</a></li>

						<li class="nav-item"><a th:href="@{/admin/reports}"
							class="nav-link"
							th:classappend="${activePage}=='reports' ? ' active'"> <i
								class="nav-icon fas fa-file-csv"></i>
								<p>Upload Reports</p>
						</a></li>
						<!-- <li class="nav-item"><a href="/admin/reports"
							class="nav-link"> <i class="nav-icon fas fa-upload"></i>
								<p>Upload Reports</p>
						</a></li> -->
						<li class="nav-item"><a href="/admin/reports/history/service"
							class="nav-link"
							th:classappend="${activePage}=='reportsHistory' ? ' active'">
								<i class="nav-icon fas fa-file-csv"></i>
								<p>Report History</p>
						</a></li>

						<li class="nav-item" sec:authorize="hasRole('ADMIN')"><a
							th:href="@{/admin/revenue}"
							th:classappend="${activePage}=='revenue' ? ' active'"
							class="nav-link"> <i class="nav-icon fas fa-coins"></i>
								<p>Revenue</p>
						</a></li>

						<li class="nav-item"><a th:href="@{/admin/analytics}"
							class="nav-link"
							th:classappend="${activePage}=='analytics' ? ' active'"> <i
								class="nav-icon fas fa-chart-line"></i>
								<p>Analytics</p>
						</a></li>

						<li class="nav-item"><a th:href="@{/admin/users/pending}"
							class="nav-link"
							th:classappend="${activePage}=='pendingUsers' ? ' active'"> <i
								class="nav-icon fas fa-user-check"></i>
								<p>User Approvals</p>
						</a></li>
						<li class="nav-item"><a th:href="@{/admin/ai-analytics}"
							class="nav-link"
							th:classappend="${activePage}=='aiAnalytics' ? ' active'"> <i
								class="nav-icon fas fa-brain"></i>
								<p>AI Analytics</p>
						</a></li>
						<!-- User Menu (if you later use same layout for NORMAL users)
                    <li class="nav-item" sec:authorize="hasRole('NORMAL')">
                        <a th:href="@{/user/dashboard}"
                           class="nav-link"
                           th:classappend="${activePage}=='userDashboard' ? ' active'">
                            <i class="nav-icon fas fa-play-circle"></i>
                            <p>My Dashboard</p>
                        </a>
                    </li>
                    -->

					</ul>
				</nav>
			</div>
		</aside>

		<!-- CONTENT WRAPPER -->
		<div class="content-wrapper p-3">
			<section class="content">
				<!-- This is where page-specific content gets injected -->
				<div th:insert="${content}"></div>
			</section>
		</div>

		<!-- FOOTER -->
		<footer class="main-footer text-center small"> © 2025 Music
			Distribution </footer>
	</div>

	<!-- JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script th:src="@{/js/app.js}"></script>
</body>
</html>
