<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | Music Distribution</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"/>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="hold-transition login-page">

<div class="login-box">
    <div class="login-logo">
        <b>Password</b> Reset
    </div>

    <div class="card">
        <div class="card-body login-card-body">

            <p class="login-box-msg">Enter your email to receive a reset link</p>

            <div th:if="${param.sent}" class="alert alert-success">
                Reset link generated (check logs / email).
            </div>
            <div th:if="${param.notfound}" class="alert alert-danger">
                Email not found.
            </div>
            <div th:if="${param.expired}" class="alert alert-warning">
                Token expired or invalid.
            </div>

            <form th:action="@{/send-reset-link}" method="post">

                <div class="input-group mb-3">
                    <input type="email" name="email" class="form-control" placeholder="Email" required>
                    <div class="input-group-append">
                        <div class="input-group-text"><i class="fas fa-envelope"></i></div>
                    </div>
                </div>

                <button class="btn btn-primary btn-block mb-2">Send Reset Link</button>
            </form>

            <p class="mb-0 text-center">
                <a th:href="@{/login}">Back to Login</a>
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
