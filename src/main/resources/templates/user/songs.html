<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="layout_user :: layout(~{::content}, 'songs')">

<div th:fragment="content">

    <h3 class="fw-bold mb-3">
        <i class="fas fa-music text-info"></i> My Songs
    </h3>

    <!-- Total Songs Counter -->
    <div class="alert alert-primary mb-4">
        <strong>Total Songs:</strong>
        <span th:text="${totalSongs}"></span>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="thead-light">
                    <tr>
                        <th>Song</th>
                        <th>Album</th>
                        <th>Lyricist</th>
                        <th>Music Director</th>
                        <th>Release Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${songs}">
                        <td th:text="${s.songName}"></td>
                        <td th:text="${s.albumName}"></td>
                        <td th:text="${s.lyricist}"></td>
                        <td th:text="${s.musicDirector}"></td>
                        <td th:text="${s.releaseDate}"></td>
                    </tr>
                </tbody>
            </table>

            <!-- Pagination -->
            <nav>
                <ul class="pagination justify-content-center mt-3">
                    <li class="page-item"
                        th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{|/user/songs?page=${currentPage-1}|}">
                            Previous
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:text="${i+1}"
                           th:href="@{|/user/songs?page=${i}|}">
                        </a>
                    </li>

                    <li class="page-item"
                        th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{|/user/songs?page=${currentPage+1}|}">
                            Next
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>

</div>

</body>
</html>
