<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Reports</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>

<body>
<div th:replace="~{layout_user :: layout(~{::content}, 'reports')}">

    <div th:fragment="content">

        <h2 class="mb-4">
            <i class="fas fa-file-excel"></i> Available Reports
        </h2>

        <form method="get" class="row mb-3">
            <div class="col-md-3">
                <label>Year</label>
                <input type="number" name="year" class="form-control"
                       placeholder="2025">
            </div>
            <div class="col-md-3">
                <label>Quarter</label>
                <select name="quarter" class="form-control">
                    <option value="">Any</option>
                    <option value="1">Q1</option>
                    <option value="2">Q2</option>
                    <option value="3">Q3</option>
                    <option value="4">Q4</option>
                </select>
            </div>

            <div class="col-md-3">
                <label>Month</label>
                <select name="month" class="form-control">
                    <option value="">Any</option>
                    <option th:each="m : ${#numbers.sequence(1,12)}"
                            th:value="${m}" th:text="${m}"></option>
                </select>
            </div>

            <div class="col-md-3 d-flex align-items-end">
                <button class="btn btn-primary w-100">
                    🔍 Search
                </button>
            </div>
        </form>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Channel</th>
                <th>Year</th>
                <th>Quarter</th>
                <th>Month</th>
                <th>Published On</th>
                <th class="text-center">Download</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${reports.isEmpty()}">
                <td colspan="7" class="text-center text-muted p-3">
                    No Reports Available
                </td>
            </tr>

            <tr th:each="r, idx : ${reports}">
                <td th:text="${idx.index + 1}"></td>
                <td th:text="${r.channelName}"></td>
                <td th:text="${r.year}"></td>
                <td th:text="${r.quarter != null ? r.quarter : '-'}"></td>
                <td th:text="${r.month != null ? r.month : '-'}"></td>
                <td th:text="${#temporals.format(r.publishedOn, 'dd-MMM-yyyy HH:mm')}"></td>

                <td class="text-center">
                    <a th:href="@{|/user/reports/${r.id}/download|}"
                       class="btn btn-success btn-sm">
                        ⬇ Download
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

    </div>

</div>
</body>
</html>
