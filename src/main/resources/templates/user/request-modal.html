<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="requestDetails">

    <div class="modal-header">
        <h5 class="modal-title">
            Request #<span th:text="${request.id}"></span> - <span th:text="${request.songName}"></span>
        </h5>
        <button type="button" class="close" data-dismiss="modal">
            <span>&times;</span>
        </button>
    </div>

    <div class="modal-body">
        <div class="row">
            <div class="col-md-6">
                <h6>Song Info</h6>
                <p><strong>Channel:</strong> <span th:text="${request.channelName}"></span></p>
                <p><strong>Primary Artist:</strong> <span th:text="${request.primaryArtist}"></span></p>
                <p><strong>Secondary Artist:</strong> <span th:text="${request.secondaryArtist}"></span></p>
                <p><strong>Lyricist:</strong> <span th:text="${request.lyricist}"></span></p>
                <p><strong>Music Director:</strong> <span th:text="${request.musicDirector}"></span></p>
                <p><strong>Album:</strong> <span th:text="${request.albumName}"></span></p>
                <p><strong>Language:</strong> <span th:text="${request.language}"></span></p>
                <p><strong>Genre:</strong> <span th:text="${request.genre}"></span></p>
                <p><strong>Release Date:</strong> <span th:text="${request.releaseDate}"></span></p>
            </div>
            <div class="col-md-6">
                <h6>Request Status</h6>
                <p><strong>Status:</strong> <span class="badge badge-info" th:text="${request.status}"></span></p>
                <p><strong>Uploaded:</strong> <span th:text="${request.uploadedDate}"></span></p>
                <p><strong>Last Updated:</strong> <span th:text="${request.lastUpdated}"></span></p>
                <p><strong>Description:</strong> <span th:text="${request.description}"></span></p>
            </div>
        </div>

        <hr/>

        <h6>Conversation</h6>
        <div class="border rounded p-2 mb-2" style="max-height:250px; overflow-y:auto;">
            <div th:each="c : ${comments}">
                <div class="mb-2">
                    <strong th:text="${c.authorType} + ' - ' + ${c.authorName}"></strong>
                    <span class="text-muted small" th:text="${c.createdAt}"></span>
                    <div th:text="${c.message}"></div>
                </div>
                <hr th:if="${!#lists.isLast(comments, c)}"/>
            </div>
            <div th:if="${#lists.isEmpty(comments)}" class="text-muted">
                No comments yet.
            </div>
        </div>

        <!-- User add comment -->
        <form th:action="@{|/user/songs/request/${request.id}/comment|}" method="post">
            <div class="form-group">
                <label>Add Comment</label>
                <textarea name="message" class="form-control" rows="2" required></textarea>
            </div>
            <button class="btn btn-primary btn-sm">Send</button>
        </form>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
    </div>

</div>

</body>
</html>
