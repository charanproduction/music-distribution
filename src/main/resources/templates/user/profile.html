<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Profile Info</title></head>

<body>
<div th:replace="~{layout_user :: layout(~{::content}, 'profile')}">
<div th:fragment="content">

<h3 class="mb-3">Profile Information</h3>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

<form method="post">
    <div class="form-group mb-3">
        <label>Full Name</label>
        <input class="form-control" name="fullName" th:value="${user.fullName}">
    </div>

    <div class="form-group mb-3">
        <label>Email</label>
        <input class="form-control" name="email" th:value="${user.email}">
    </div>

    <div class="form-group mb-3">
        <label>Phone</label>
        <input class="form-control" name="contactNo" th:value="${user.contactNo}">
    </div>

    <div class="form-group mb-3">
        <label>Channel</label>
        <input class="form-control" name="channelName" th:value="${user.channelName}" disabled>
    </div>
    <div class="form-group mb-3">
        <label>Address</label>
        <input class="form-control" name="address" th:value="${user.address}" disabled>
    </div>

    <button class="btn btn-primary">Save Changes</button>
</form>

</div></div>
</body>
</html>
