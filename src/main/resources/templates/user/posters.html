<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AI Poster Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div th:replace="~{layout_user :: layout(~{::content}, 'poster')}">
 <div th:fragment="content">
<div class="container py-4">

    <h2 class="mb-3">AI Poster Generator</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Single form: supports both prompt-only and prompt+uploads -->
    <div class="card mb-4">
        <div class="card-header bg-secondary text-white">
            Create New Poster
        </div>
        <div class="card-body">
            <form th:action="@{/user/posters/generate}" method="post" enctype="multipart/form-data">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Song Title *</label>
                        <input type="text" name="songTitle" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Language</label>
                        <input type="text" name="language" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Channel Name</label>
                        <input type="text" name="channelName" class="form-control">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Artist Name</label>
                        <input type="text" name="artistName" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Production Label</label>
                        <input type="text" name="productionLabel" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Creative Prompt</label>
                    <textarea name="prompt" class="form-control" rows="3"
                              placeholder="Describe mood, style, colors, background, etc."></textarea>
                    <small class="text-muted">
                        You can leave uploads empty and only use the prompt, or upload images to combine.
                    </small>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Artist Image</label>
                        <input type="file" name="artistImage" class="form-control" accept="image/*">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Channel Logo</label>
                        <input type="file" name="channelLogo" class="form-control" accept="image/*">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Production Label Logo</label>
                        <input type="file" name="productionLogo" class="form-control" accept="image/*">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Generate Poster
                </button>

            </form>
        </div>
    </div>

    <!-- Gallery -->
    <h4 class="mb-3">Your Generated Posters</h4>
    <div class="row g-3" th:if="${#lists.isEmpty(posters) == false}">
        <div class="col-md-3" th:each="poster : ${posters}">
            <div class="card bg-secondary text-light h-100">
                <img th:src="@{'/user/posters/' + ${poster.id} + '/image'}"
                     class="card-img-top" alt="Poster"
                     style="object-fit: cover; height: 220px;">

                <div class="card-body">
                    <h6 class="card-title" th:text="${poster.songTitle}">Song</h6>
                    <p class="card-text small" th:text="${poster.artistName}">Artist</p>
                </div>
                <div class="card-footer">
                    <a th:href="@{'/user/posters/' + ${poster.id} + '/image'}"
                       class="btn btn-sm btn-outline-light" download>
                        Download
                    </a>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(posters)}" class="text-muted">
        No posters generated yet.
    </p>

</div>
</div>
</div>
</body>
</html>
