<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en"
	th:fragment="layout(content, activePage)">
<head>
<meta charset="UTF-8" />
<title th:text="${pageTitle} ?: 'Music Portal'">Music Portal</title>

<!-- CSS -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />

<style>
.nav-sidebar .nav-link.active {
	background-color: #0d6efd !important;
	color: #fff !important;
}

.navbar-brand {
	font-size: 1.25rem;
	letter-spacing: .5px;
}

.dropdown-menu {
	border-radius: 10px;
	padding: 0.5rem;
}

.dropdown-item i {
	width: 20px;
}

.navbar-nav .dropdown-menu {
	border-radius: 10px;
	min-width: 180px;
}

.dropdown-item i {
	width: 18px;
}
.poster-img {
        height: 280px;
        object-fit: cover;
        border-bottom: 1px solid #eee;
    }
</style>
</head>

<body class="hold-transition sidebar-mini layout-fixed">
	<div class="wrapper">

		<!-- NAVBAR -->
		<nav class="main-header navbar navbar-expand navbar-dark bg-dark">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link" data-widget="pushmenu"
					href="#"><i class="fas fa-bars"></i></a></li>
				<li class="nav-item d-none d-sm-inline-block text-white pt-2">
					<strong>🎧 Music Distribution</strong>
				</li>
			</ul>
			<ul class="navbar-nav ml-auto align-items-center">

				<!-- Welcome text -->
				<li class="nav-item d-none d-sm-inline-block mr-2"><span
					class="text-light"> Welcome,&nbsp;<strong
						th:text="${#authentication.name}">User</strong>
				</span></li>

				<!-- Profile Dropdown -->
				<li class="nav-item dropdown"><a class="nav-link"
					data-toggle="dropdown" href="#" aria-expanded="false"> <i
						class="fas fa-user-circle fa-lg text-light"></i>
				</a>
					<div class="dropdown-menu dropdown-menu-right shadow-sm">

						<a class="dropdown-item" th:href="@{/user/profile}"> <i
							class="fas fa-id-badge text-primary mr-2"></i> Profile Info
						</a> <a class="dropdown-item" th:href="@{/user/bank}"> <i
							class="fas fa-university text-success mr-2"></i> Bank Details
						</a> <a class="dropdown-item" th:href="@{/user/change-password}">
							<i class="fas fa-key text-warning mr-2"></i> Change Password
						</a>

						<div class="dropdown-divider"></div>

						<form th:action="@{/logout}" method="post"
							class="dropdown-item p-0">
							<button class="btn btn-link text-danger dropdown-item">
								<i class="fas fa-sign-out-alt mr-2"></i> Logout
							</button>
						</form>

					</div></li>
			</ul>
		</nav>

		<!-- SIDEBAR -->
		<aside class="main-sidebar sidebar-dark-primary elevation-4">
			<a href="#" class="brand-link text-center"> <span
				class="brand-text font-weight-light">Music Portal</span>
			</a>
			<div class="sidebar">
				<nav class="mt-2">
					<ul class="nav nav-pills nav-sidebar flex-column">

						<li class="nav-item"><a th:href="@{/user/dashboard}"
							class="nav-link"
							th:classappend="${activePage}=='dashboard' ? 'active'"> <i
								class="nav-icon fas fa-gauge"></i>
								<p>Dashboard</p>
						</a></li>

						<li class="nav-item"><a th:href="@{/user/songs}"
							class="nav-link"
							th:classappend="${activePage}=='songs' ? 'active'"> <i
								class="nav-icon fas fa-music"></i>
								<p>All Songs</p>
						</a></li>

						<li class="nav-item"><a th:href="@{/user/requests}"
							class="nav-link"
							th:classappend="${activePage}=='upload' ? 'active'"> <i
								class="nav-icon fas fa-upload"></i>
								<p>Upload Song</p>
						</a></li>

						<li class="nav-item"><a th:href="@{/user/requests/songs}"
							class="nav-link"
							th:classappend="${activePage}=='requests' ? 'active'"> <i
								class="nav-icon fas fa-list-check"></i>
								<p>Song Requests</p>
						</a></li>

						<li class="nav-item"><a th:href="@{/user/revenue}"
							class="nav-link"
							th:classappend="${activePage}=='revenue' ? 'active'"> <i
								class="nav-icon fas fa-coins"></i>
								<p>Revenue</p>
						</a></li>

						<li class="nav-item"><a th:href="@{/user/analytics}"
							class="nav-link"
							th:classappend="${activePage}=='analytics' ? 'active'"> <i
								class="nav-icon fas fa-chart-line"></i>
								<p>Analytics</p>
						</a></li>
						<li class="nav-item"><a class="nav-link"
							th:href="@{/user/reports}"> <i class="fas fa-file-excel"></i>
								<p>Reports</p>
						</a></li>
						<li class="nav-item"><a class="nav-link"
							th:href="@{/user/compliance}"> <i class="fas fa-user-shield"></i>
								<p>Compliance</p>
						</a></li>
						<li class="nav-item" sec:authorize="isAuthenticated()"><a
							th:href="@{/user/posters}" class="nav-link"
							th:classappend="${activePage}=='poster' ? ' active'"> <i
								class="nav-icon fas fa-image"></i>
								<p>AI Poster Studio</p>
						</a></li>

					</ul>
				</nav>
			</div>
		</aside>

		<!-- PAGE CONTENT -->
		<div class="content-wrapper p-3">
			<section class="content">
				<div th:replace="${content}"></div>
			</section>
		</div>

		<footer class="main-footer text-center small"> © 2025 Music
			Distribution </footer>

	</div>

	<!-- JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

</body>
</html>
